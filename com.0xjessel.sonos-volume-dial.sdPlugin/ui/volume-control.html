<!DOCTYPE html>
<html>
<head lang="en">
    <title>Sonos Volume Control Settings</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../libs/css/sdpi.css">
    <style>
        /* Make labels white */
        .sdpi-item-label {
            color: white;
        }

        /* Make input text white */
        .sdpi-item-value {
            color: white !important;
        }

        /* Make select options white on dark background */
        select.sdpi-item-value option {
            background-color: #2D2D2D;
            color: white;
        }

        /* Ensure input placeholder text is slightly dimmed */
        .sdpi-item-value::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Error message styling */
        .error {
            color: #f44336;
        }

        /* Invalid input styling */
        .invalid {
            border-color: #f44336 !important;
            border-width: 1px;
        }

        /* Info tooltip styling */
        .info-tooltip {
            font-size: 12px;
            color: #999;
            display: block;
            clear: both;
        }

        /* Validation message styling */
        .validation-message {
            font-size: 12px;
            color: #f44336;
            display: none;
            width: 100%;
            clear: both;
            margin: 4px 0;
            padding-left: 96px;
        }

        /* Ensure input text is white */
        input.sdpi-item-value, select.sdpi-item-value {
            color: white !important;
        }
    </style>
</head>

<body>
    <div class="sdpi-wrapper">
        <!-- Room picker: rooms are discovered via SSDP as soon as this panel opens -->
        <div class="sdpi-item">
            <div class="sdpi-item-label">Room</div>
            <select class="sdpi-item-value" id="roomSelect">
                <option value="">Searching...</option>
            </select>
        </div>
        <div class="sdpi-item">
            <div class="spdi-item-value info-tooltip" id="discoverStatus">Looking for Sonos rooms on your network...</div>
        </div>

        <!-- Manual IP, shown only when "Enter IP address manually" is chosen -->
        <div class="sdpi-item" id="speakerIpRow" style="display: none;">
            <div class="sdpi-item-label">Speaker IP</div>
            <input class="sdpi-item-value" type="text" id="speakerIp" setting="speakerIp" placeholder="192.168.1.100" pattern="^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$">
        </div>
        <div class="validation-message" id="ipValidationMessage">Please enter a valid IP address (e.g., 192.168.1.100)</div>
        <div class="sdpi-item" id="speakerIpHelp" style="display: none;">
            <div class="spdi-item-value info-tooltip">Find it in the Sonos app under Settings > General Settings > About Your System. A manual address is used as-is and never changed by discovery.</div>
        </div>

        <!-- Volume Step Configuration -->
        <div class="sdpi-item">
            <div class="sdpi-item-label">Volume Step</div>
            <select class="sdpi-item-value" id="volumeStep" setting="volumeStep">
                <option value="1">1%</option>
                <option value="2">2%</option>
                <option value="5" selected>5%</option>
                <option value="10">10%</option>
            </select>
        </div>
    </div>

    <!-- Stream Deck Property Inspector Library -->
    <script src="../libs/js/property-inspector.js"></script>

    <script>
        // Load Stream Deck library
        let websocket = null;
        let pluginAction = null;
        let currentSettings = {};
        const ACTION_UUID = 'com.0xjessel.sonos-volume-dial.volume';
        const RESCAN = '__rescan';
        const MANUAL = '__manual';
        let discoveredRooms = [];
        let manualMode = false;

        function setDiscoverStatus(text) {
            const el = document.getElementById('discoverStatus');
            el.textContent = text;
            el.parentElement.style.display = text ? '' : 'none';
        }

        function showManualIp(show) {
            manualMode = show;
            document.getElementById('speakerIpRow').style.display = show ? '' : 'none';
            document.getElementById('speakerIpHelp').style.display = show ? '' : 'none';
        }

        function isManualSetting(settings) {
            return !!settings.speakerIp && !settings.roomName;
        }

        function requestDiscovery() {
            if (!websocket) return;
            setDiscoverStatus('Looking for Sonos rooms on your network...');
            websocket.send(JSON.stringify({
                event: 'sendToPlugin',
                action: ACTION_UUID,
                context: pluginAction,
                payload: { event: 'discoverRooms' }
            }));
        }

        // Rebuild the dropdown: discovered rooms, then the two built-in choices.
        function renderRoomSelect() {
            const select = document.getElementById('roomSelect');
            select.innerHTML = '';
            const manual = isManualSetting(currentSettings) || manualMode;
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Choose a room...';
            select.appendChild(placeholder);

            discoveredRooms.forEach((room) => {
                const option = document.createElement('option');
                option.value = room.host;
                option.textContent = room.name;
                select.appendChild(option);
            });

            const manualOption = document.createElement('option');
            manualOption.value = MANUAL;
            manualOption.textContent = 'Enter IP address manually...';
            select.appendChild(manualOption);

            const rescanOption = document.createElement('option');
            rescanOption.value = RESCAN;
            rescanOption.textContent = 'Search again...';
            select.appendChild(rescanOption);

            // Reflect the saved choice
            const match = discoveredRooms.find((room) =>
                room.host === currentSettings.speakerIp || (currentSettings.roomName && room.name === currentSettings.roomName));
            if (manual) {
                select.value = MANUAL;
            } else if (match) {
                select.value = match.host;
            } else {
                select.value = '';
            }
            showManualIp(manual);
        }

        function populateRooms(rooms) {
            discoveredRooms = rooms;
            renderRoomSelect();
            if (rooms.length === 0) {
                setDiscoverStatus('No Sonos rooms found. Check the speakers are on the same network, then choose "Search again".');
            } else if (isManualSetting(currentSettings) || currentSettings.roomName) {
                setDiscoverStatus('');
            } else {
                setDiscoverStatus(rooms.length + ' room' + (rooms.length === 1 ? '' : 's') + ' found. Pick one to control it.');
            }
        }

        function validateIPAddress(ip) {
            // Regular expression for IP address validation
            const ipRegex = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            return ipRegex.test(ip);
        }

        function showValidationMessage(show) {
            const message = document.getElementById('ipValidationMessage');
            const input = document.getElementById('speakerIp');
            
            if (show) {
                message.style.display = 'block';
                input.classList.add('invalid');
            } else {
                message.style.display = 'none';
                input.classList.remove('invalid');
            }
        }

        // Connect to Stream Deck
        window.connectElgatoStreamDeckSocket = function(inPort, inPluginUUID, inRegisterEvent, inInfo) {
            // Use the plugin UUID as the context for property inspector
            pluginAction = inPluginUUID;
            
            websocket = new WebSocket("ws://127.0.0.1:" + inPort);

            websocket.onopen = function() {
                // Register plugin with Stream Deck
                const registerEvent = {
                    event: inRegisterEvent,
                    uuid: inPluginUUID
                };
                websocket.send(JSON.stringify(registerEvent));

                // Request current settings
                const getSettingsEvent = {
                    event: "getSettings",
                    context: pluginAction
                };
                websocket.send(JSON.stringify(getSettingsEvent));
            };

            websocket.onmessage = function(evt) {
                const jsonObj = JSON.parse(evt.data);
                const { event, payload } = jsonObj;

                if (event === "didReceiveSettings") {
                    const firstLoad = !discoveredRooms.length && !currentSettings.volumeStep;
                    currentSettings = payload.settings;
                    updateUI(payload.settings);
                    if (firstLoad) requestDiscovery();
                } else if (event === "sendToPropertyInspector") {
                    if (payload && payload.event === 'rooms') {
                        populateRooms(payload.rooms || []);
                    } else if (payload && payload.event === 'discoveryFailed') {
                        populateRooms([]);
                        setDiscoverStatus('Could not search for Sonos rooms: ' + (payload.message || 'unknown error') + '. Choose "Search again" or enter an IP manually.');
                    }
                }
            };
        }

        // Update UI with settings
        function updateUI(settings) {
            // Update IP address input
            const ipInput = document.getElementById("speakerIp");
            if (settings.speakerIp !== undefined) {
                ipInput.value = settings.speakerIp;
            }

            // Keep the room picker in step with the saved speaker
            if (discoveredRooms.length) renderRoomSelect();

            // Update volume step select
            const stepSelect = document.getElementById("volumeStep");
            if (settings.volumeStep !== undefined) {
                stepSelect.value = settings.volumeStep.toString();
            }
        }

        // Save settings when inputs change
        function saveSettings() {
            if (!websocket) return;

            const speakerIp = document.getElementById("speakerIp").value;
            const volumeStep = parseInt(document.getElementById("volumeStep").value);

            // Don't save if IP is invalid, but still show validation message
            if (speakerIp && !validateIPAddress(speakerIp)) {
                showValidationMessage(true);
                return;
            }

            showValidationMessage(false);

            // Remember the room name when the IP came from discovery, so the plugin can
            // re-resolve it if the speaker's address changes. Clear it for a manual IP.
            const matchedRoom = manualMode ? undefined : discoveredRooms.find((room) => room.host === speakerIp);
            const roomName = matchedRoom ? matchedRoom.name : undefined;

            // Merge with current settings to preserve other values
            const settings = {
                ...currentSettings,
                speakerIp,
                roomName,
                volumeStep
            };

            // Update our local copy
            currentSettings = settings;

            // Send to Stream Deck
            websocket.send(JSON.stringify({
                event: "setSettings",
                context: pluginAction,
                payload: settings
            }));
        }

        // Validate IP address in real-time
        function validateInput(e) {
            const ip = e.target.value;
            if (ip && !validateIPAddress(ip)) {
                showValidationMessage(true);
            } else {
                showValidationMessage(false);
            }
        }

        // Add event listeners
        const speakerIpInput = document.getElementById("speakerIp");
        speakerIpInput.addEventListener("input", (e) => {
            validateInput(e);
            saveSettings();
        });
        document.getElementById("volumeStep").addEventListener("change", saveSettings);
        document.getElementById("roomSelect").addEventListener("change", (e) => {
            const value = e.target.value;
            if (value === RESCAN) {
                renderRoomSelect();
                requestDiscovery();
                return;
            }
            if (value === MANUAL) {
                showManualIp(true);
                setDiscoverStatus('Type the speaker\'s IP address below.');
                document.getElementById("speakerIp").focus();
                return;
            }
            if (!value) return;
            showManualIp(false);
            document.getElementById("speakerIp").value = value;
            showValidationMessage(false);
            saveSettings();
            setDiscoverStatus('');
        });
    </script>
</body>
</html>
